version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # Set to 0 to disable version updates; security updates will still open PRs
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ⬆

  # Python uv
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: ⬆

  # npm
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: ⬆

  # Docker
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      docker-images:
        patterns: ["*"]
    commit-message:
      prefix: ⬆

  # Docker Compose
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      compose-config:
        patterns: ["*"]
