# Directories follow the workspace layout: uv.lock and pnpm-lock.yaml both live
# at the repository root, and the only Dockerfile is backend/Dockerfile.
# `cooldown` holds a release for a week before a PR is opened, which is what
# zizmor's dependabot-cooldown audit asks for.
version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0 # Set to 0 to disable version updates; security updates will still open PRs
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ⬆

  # Python, resolved by uv across the workspace from the root lock file.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: ⬆

  # JavaScript, resolved by pnpm across the workspace from the root lock file.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      npm-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: ⬆

  # Base images in backend/Dockerfile. There is no frontend image: the front
  # end is built off the instance and served by stock Caddy.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      docker-images:
        patterns: ["*"]
    commit-message:
      prefix: ⬆

  # Images pinned in compose.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      compose-config:
        patterns: ["*"]
    commit-message:
      prefix: ⬆
