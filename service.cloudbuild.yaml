apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: capanel-service
  labels:
    cloud.googleapis.com/location: us-west1
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: ca-panel-001:us-west1:capanel-pg
    spec:
      serviceAccountName: capanel-runner@ca-panel-001.iam.gserviceaccount.com
      containers:
      - name: frontend
        image: __FRONTEND_IMAGE__
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
      - name: backend
        image: __BACKEND_IMAGE__
        env:
        - name: PORT
          value: "8000"
        - name: ENVIRONMENT
          value: "production"
        - name: PROJECT_NAME
          value: "California Accountability Panel"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: capanel-secret-key
        - name: FIRST_SUPERUSER
          valueFrom:
            secretKeyRef:
              key: latest
              name: capanel-superuser-email
        - name: FIRST_SUPERUSER_PASSWORD
          valueFrom:
            secretKeyRef:
              key: latest
              name: capanel-superuser-password
        - name: POSTGRES_SERVER
          value: "localhost"
        - name: POSTGRES_USER
          value: "capanel_app"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: latest
              name: capanel-postgres-password
        - name: POSTGRES_DB
          value: "capanel"
        - name: CLOUD_SQL_INSTANCE_CONNECTION_NAME
          value: "ca-panel-001:us-west1:capanel-pg"
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
