services:

  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  backend:
    image: appcap-backend
    restart: always
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER?Variable not set}:${POSTGRES_PASSWORD?Variable not set}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB?Variable not set}
      - RUN_STARTUP_DATA_IMPORTS=${RUN_STARTUP_DATA_IMPORTS-false}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

  prestart:
    image: appcap-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: python app/scripts/prestart.py
    env_file:
      - .env
    environment:
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER?Variable not set}:${POSTGRES_PASSWORD?Variable not set}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB?Variable not set}
      - RUN_DATA_IMPORTS=${RUN_DATA_IMPORTS-true}
      - RUN_STARTUP_DATA_IMPORTS=${RUN_STARTUP_DATA_IMPORTS-false}
      - IMPORT_ELA_DATA_FILE=${IMPORT_ELA_DATA_FILE-/app/backend/resources/cde/eladownload2025.xlsx}
      - IMPORT_INDICATORS_SOURCE=${IMPORT_INDICATORS_SOURCE-cde}
      - IMPORT_INDICATORS_PATH=${IMPORT_INDICATORS_PATH-/app/backend/resources/cde}
      - IMPORT_INDICATORS_INDICATOR=${IMPORT_INDICATORS_INDICATOR-}
      - IMPORT_INDICATORS_BATCH_SIZE=${IMPORT_INDICATORS_BATCH_SIZE-1000}
  
  frontend:
    image: appcap-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    networks:
      - default

volumes:
  app-db-data:
