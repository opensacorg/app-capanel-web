# Workspace root. Every Python command is run from here:
#
#   uv run fastapi dev          # the API, reloading, on :8000
#   uv run alembic upgrade head
#   uv run pytest
#   uv run ruff format; uv run ruff check --fix; uv run ty check
#
# The application itself lives in the `backend` member and is installed into
# the root virtualenv as an editable package, so `app.*` imports resolve here
# without a `cd`.

[dependency-groups]
dev = ["prek>=0.4.11,<1.0.0", "typer>=0.26.1,<1.0.0", "zizmor>=1.28.0"]

github-actions = ["smokeshow >=0.5.0"]

[tool.uv.workspace]
members = ["backend"]

# `fastapi dev` / `fastapi run` look for this in the pyproject.toml of the
# directory they are invoked from. Without it the CLI falls back to scanning
# the working directory for a `main.py`, finds none at the root, and exits with
# "Could not find a default file to run".
[tool.fastapi]
entrypoint = "app.main:app"

# ruff is run from the root too, and picks its settings from the pyproject.toml
# nearest each file. Anything under `backend/` gets that member's settings; this
# is what everything else -- scripts and tooling at the root -- is checked with.
# Without it those files fall back to ruff's default target version, which is
# older than the interpreter the project actually runs, so 3.14 syntax would be
# reported as an error outside `backend/`.
[tool.ruff]
target-version = "py314"

# pytest is run from the root too. Naming the path keeps the rootdir here
# rather than wherever the first test file happens to live.
[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.typos.files]
extend-exclude = [
  "img/",
  "uv.lock",
  "pnpm-lock.yaml",
  "backend/coverage/",
  "backend/htmlcov/",
  "frontend/dist/",
  "frontend/public/assets/images/",
  "frontend/src/lib/client/",
]

[tool.typos.default]
extend-ignore-re = [
  # GitHub usernames in @mentions
  "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
  # Name of the package in the PR title
  "Bump certifi ",
]

[tool.typos.default.extend-identifiers]
alls = "alls"
