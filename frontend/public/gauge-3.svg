<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130">
  <!-- Colored segments (left to right: red, orange, yellow, green, blue) -->
  <!-- Level 1: Very Low (Red) - 180° to 144° -->
  <path d="M 100 110 L 10 110 A 90 90 0 0 1 27.64 51.18 Z" fill="#a10008" opacity="0.5"/>
  <!-- Level 2: Low (Orange) - 144° to 108° -->
  <path d="M 100 110 L 27.64 51.18 A 90 90 0 0 1 72.18 24.27 Z" fill="#fba32a" opacity="0.5"/>
  <!-- Level 3: Medium (Yellow) - 108° to 72° -->
  <path d="M 100 110 L 72.18 24.27 A 90 90 0 0 1 127.82 24.27 Z" fill="#fffc40"/>
  <!-- Level 4: High (Green) - 72° to 36° -->
  <path d="M 100 110 L 127.82 24.27 A 90 90 0 0 1 172.36 51.18 Z" fill="#086312" opacity="0.5"/>
  <!-- Level 5: Very High (Blue) - 36° to 0° -->
  <path d="M 100 110 L 172.36 51.18 A 90 90 0 0 1 190 110 Z" fill="#0026f6" opacity="0.5"/>
  
  <!-- Outer arc for smooth rounded appearance -->
  <path d="M 10 110 A 90 90 0 0 1 190 110" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center hub -->
  <circle cx="100" cy="110" r="12" fill="white"/>
  
  <!-- Arrow/Needle pointing to Level 3 (90° = straight up) -->
  <g transform="rotate(0, 100, 110)">
    <line x1="100" y1="110" x2="100" y2="35" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <polygon points="100,25 95,40 105,40" fill="#333"/>
  </g>
  
  <!-- Center dot -->
  <circle cx="100" cy="110" r="5" fill="#333"/>
</svg>
