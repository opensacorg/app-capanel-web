options:
  machineType: '${_MACHINE_TYPE}'

steps:
  - id: 'pull-frontend-cache'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'docker pull "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:latest" || true'
    waitFor: ['-']

  - id: 'pull-backend-cache'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'docker pull "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:latest" || true'
    waitFor: ['-']

  - id: 'build-frontend'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:${BUILD_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - '--build-arg'
      - 'VITE_API_URL=${_VITE_API_URL}'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'
    waitFor: ['pull-frontend-cache']

  - id: 'build-backend'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:${BUILD_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'
    waitFor: ['pull-backend-cache']

  - id: 'push-frontend'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e
        docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:${BUILD_ID}"
        docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:latest"
    waitFor: ['build-frontend']

  - id: 'push-backend'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e
        docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:${BUILD_ID}"
        docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:latest"
    waitFor: ['build-backend']

  - id: 'deploy-cloud-run'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        FRONTEND_IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:${BUILD_ID}"
        BACKEND_IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:${BUILD_ID}"
        sed "s|__FRONTEND_IMAGE__|$${FRONTEND_IMAGE}|g; s|__BACKEND_IMAGE__|$${BACKEND_IMAGE}|g" service.cloudbuild.yaml > /workspace/service.rendered.yaml
        gcloud run services replace /workspace/service.rendered.yaml --region "${_REGION}"
    waitFor: ['push-frontend', 'push-backend']

substitutions:
  _REGION: 'us-west1'
  _REPOSITORY: 'capanel-repo'
  _MACHINE_TYPE: 'E2_HIGHCPU_8'
  _VITE_API_URL: '/api/v1'
