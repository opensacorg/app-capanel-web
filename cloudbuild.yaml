options:
  machineType: '${_MACHINE_TYPE}'

steps:
  - id: 'pull-frontend-cache'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'docker pull "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:latest" || true'
    waitFor: ['-']

  - id: 'pull-backend-cache'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'docker pull "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:latest" || true'
    waitFor: ['-']

  - id: 'build-frontend'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:${BUILD_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - '--build-arg'
      - 'VITE_API_URL=${_VITE_API_URL}'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'
    waitFor: ['pull-frontend-cache']

  - id: 'build-backend'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:${BUILD_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'
    waitFor: ['pull-backend-cache']

  - id: 'push-frontend'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e
        docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:${BUILD_ID}"
        docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:latest"
    waitFor: ['build-frontend']

  - id: 'push-backend'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e
        docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:${BUILD_ID}"
        docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:latest"
    waitFor: ['build-backend']

  - id: 'deploy-cloud-run'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        DEFAULTS_FILE="./backend/app/scripts/gcp.defaults.env"
        if [[ -f "${DEFAULTS_FILE}" ]]; then
          source "${DEFAULTS_FILE}"
        fi
        DEFAULT_IMPORT_RESOURCES_LOCAL_PATH="/workspace/resources"

        FRONTEND_IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:${BUILD_ID}"
        BACKEND_IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/backend:${BUILD_ID}"
        FULL_SERVICE="${FULL_SERVICE:-${DEFAULT_FULL_SERVICE:-capanel-full}}"
        RUN_SERVICE_ACCOUNT="${RUN_SERVICE_ACCOUNT:-${DEFAULT_RUN_SERVICE_ACCOUNT:-capanel-runner}}"
        RUN_SERVICE_ACCOUNT_EMAIL="${RUN_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com"
        CLOUD_SQL_INSTANCE="${CLOUD_SQL_INSTANCE:-${DEFAULT_CLOUD_SQL_INSTANCE:-capanel-pg}}"
        CLOUD_SQL_CONNECTION_NAME="${PROJECT_ID}:${_REGION}:${CLOUD_SQL_INSTANCE}"
        CLOUD_SQL_DB="${CLOUD_SQL_DB:-${DEFAULT_CLOUD_SQL_DB:-capanel}}"
        CLOUD_SQL_USER="${CLOUD_SQL_USER:-${DEFAULT_CLOUD_SQL_USER:-capanel_app}}"
        PROJECT_NAME="${PROJECT_NAME:-${DEFAULT_PROJECT_NAME:-California Accountability Panel}}"
        IMPORT_GCS_URI="${IMPORT_GCS_URI:-${DEFAULT_IMPORT_GCS_URI:-gs://${PROJECT_ID}-resources/resources}}"
        IMPORT_RESOURCES_LOCAL_PATH="${IMPORT_RESOURCES_LOCAL_PATH:-${DEFAULT_IMPORT_RESOURCES_LOCAL_PATH:-/workspace/resources}}"
        VPC_NETWORK="${VPC_NETWORK:-${DEFAULT_VPC_NETWORK:-default}}"
        VPC_SUBNET="${VPC_SUBNET:-${DEFAULT_VPC_SUBNET:-default}}"
        EXISTING_URL="$(gcloud run services describe "${FULL_SERVICE}" --region "${_REGION}" --format='value(status.url)' 2>/dev/null || true)"
        FRONTEND_HOST="${FRONTEND_HOST_PRODUCTION:-${DEFAULT_FRONTEND_HOST_PRODUCTION:-${EXISTING_URL:-https://localhost}}}"
        BACKEND_CORS_ORIGINS="${BACKEND_CORS_ORIGINS_PRODUCTION:-${BACKEND_CORS_ORIGINS:-${FRONTEND_HOST}}}"

        FULL_SERVICE="${FULL_SERVICE}" \
        GCP_REGION="${_REGION}" \
        RUN_SERVICE_ACCOUNT_EMAIL="${RUN_SERVICE_ACCOUNT_EMAIL}" \
        FRONTEND_IMAGE="${FRONTEND_IMAGE}" \
        BACKEND_IMAGE="${BACKEND_IMAGE}" \
        CLOUD_SQL_CONNECTION_NAME="${CLOUD_SQL_CONNECTION_NAME}" \
        ENVIRONMENT="production" \
        PROJECT_NAME="${PROJECT_NAME}" \
        API_V1_STR="${_VITE_API_URL}" \
        BACKEND_CORS_ORIGINS="${BACKEND_CORS_ORIGINS}" \
        FRONTEND_HOST="${FRONTEND_HOST}" \
        CLOUD_SQL_DB="${CLOUD_SQL_DB}" \
        CLOUD_SQL_USER="${CLOUD_SQL_USER}" \
        RUN_DATA_IMPORTS="false" \
        RUN_STARTUP_DATA_IMPORTS="false" \
        IMPORT_GCS_URI="${IMPORT_GCS_URI}" \
        IMPORT_RESOURCES_LOCAL_PATH="${IMPORT_RESOURCES_LOCAL_PATH}" \
        VPC_NETWORK="${VPC_NETWORK}" \
        VPC_SUBNET="${VPC_SUBNET}" \
        python ./backend/app/scripts/render_cloud_run_service.py > /workspace/service.rendered.yaml
        gcloud run services replace /workspace/service.rendered.yaml --region "${_REGION}"
    waitFor: ['push-frontend', 'push-backend']

substitutions:
  _REGION: 'us-west1'
  _REPOSITORY: 'capanel-repo'
  _MACHINE_TYPE: 'E2_HIGHCPU_8'
  _VITE_API_URL: '/api/v1'
